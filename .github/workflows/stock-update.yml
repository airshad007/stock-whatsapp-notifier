name: Stock WhatsApp Notifier

on:
  schedule:
    # Times are UTC and do NOT auto-adjust for daylight saving.
    # These are set for ~6:45 AM and ~1:15 PM US Pacific during PDT (UTC-7).
    # During PST (UTC-8, roughly Nov-Mar) actual delivery will be ~1 hour later
    # Pacific time - shift both by -1 hour in November and +1 hour back in March
    # if you want it pinned to the same Pacific time year-round.
    - cron: "45 13 * * 1-5"  # ~6:45 AM Pacific, weekdays
    - cron: "15 20 * * 1-5"  # ~1:15 PM Pacific, weekdays
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python notifier.py send
        env:
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: en_US
          WHATSAPP_TO_NUMBERS: ${{ secrets.WHATSAPP_TO_NUMBERS }}
